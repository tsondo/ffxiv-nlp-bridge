[project]
name = "ffxiv-nlp-bridge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "openai>=1.0",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
]

[project.scripts]
ffxiv-nlp = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
